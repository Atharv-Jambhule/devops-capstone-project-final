apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: python-checks
spec:
  workspaces:
    - name: source
  steps:
    - name: install-lint-test
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir -r requirements.txt
        flake8 service tests run.py
        nosetests

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah
spec:
  params:
    - name: IMAGE
      type: string
  workspaces:
    - name: source
  steps:
    - name: build-image
      image: quay.io/buildah/stable:v1.35
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
      script: |
        #!/bin/sh
        set -eu
        buildah bud -f Dockerfile -t "$(params.IMAGE)" .
